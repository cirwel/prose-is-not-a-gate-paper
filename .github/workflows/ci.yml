name: CI

# Runs the text hygiene check, the raw-record recount against results/summary.json,
# and the unit tests. It does not build the manuscript or regenerate the tables.
# The jobs run only while the repository is public: hosted minutes are free
# there, and a self-hosted runner must never be registered on a public repo.
# While the repository is private, run the same three commands locally.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Manuscript and public-surface hygiene
        run: python scripts/check_manuscript_hygiene.py
      - name: Recount raw records against results/summary.json
        run: python scripts/recount_independent.py
      - name: Unit tests
        run: python -m pytest -q tests
